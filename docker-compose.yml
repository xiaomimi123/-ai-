services:
  backend:
    build:
      context: ./backend
    image: lingjing-api:latest
    restart: always
    environment:
      # 数据库 DSN：utf8mb4 / parseTime / loc 三件套缺一不可
      - SQL_DSN=root:${MYSQL_PASSWORD}@tcp(mysql:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=${TZ:-Asia/Shanghai}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CORS_FALLBACK_OPEN=${CORS_FALLBACK_OPEN:-false}
      - SYSTEM_NAME=${SITE_NAME:-AI API Platform}
      - SERVER_ADDRESS=${SITE_URL}
      - ROOT_USER_EMAIL=${ROOT_USER_EMAIL:-admin@example.com}
      - STREAM_NORMALIZER=${STREAM_NORMALIZER:-on}
      # 异步任务系统
      - ENABLE_TASK_SYSTEM=${ENABLE_TASK_SYSTEM:-false}
      - TASK_WORKER_INTERVAL=${TASK_WORKER_INTERVAL:-5s}
      - TASK_WORKER_BATCH_SIZE=${TASK_WORKER_BATCH_SIZE:-50}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-20}
      - TASK_RETENTION_DAYS=${TASK_RETENTION_DAYS:-30}
      - TASK_UPSTREAM_HTTP_TIMEOUT=${TASK_UPSTREAM_HTTP_TIMEOUT:-180s}
      - TASK_MAX_FETCH_ERRORS=${TASK_MAX_FETCH_ERRORS:-5}
      - TASK_SYNC_WAIT_SECONDS=${TASK_SYNC_WAIT_SECONDS:-300}
      - TASK_SYNC_POLL_INTERVAL_SECONDS=${TASK_SYNC_POLL_INTERVAL_SECONDS:-2}
    volumes:
      - ${BACKEND_DATA_PATH:-backend-data}:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - api-net
    # 防 Go 服务异常泄漏吃光整机资源
    mem_limit: 4g
    mem_reservation: 512m
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: oneapi
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # max_connections=500：AI 调用 hold 连接久，默认 151 不够
    # innodb_buffer_pool_size=2G：热点表常驻内存，避免磁盘 IO 成瓶颈
    command:
      - --max-connections=500
      - --innodb-buffer-pool-size=2G
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
    volumes:
      - ${MYSQL_DATA_PATH:-mysql-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-net
    mem_limit: 3g
    mem_reservation: 1g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${REDIS_DATA_PATH:-redis-data}:/data
    networks:
      - api-net
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
    image: ai-platform-frontend:latest
    restart: always
    environment:
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - SITE_NAME=${SITE_NAME:-AI API Platform}
      - BRAND_LOGO_URL=${BRAND_LOGO_URL:-}
      - BRAND_PRIMARY_COLOR=${BRAND_PRIMARY_COLOR:-#2ECC71}
      - BRAND_FOOTER_TEXT=${BRAND_FOOTER_TEXT:-}
      - BRAND_ICP_NUMBER=${BRAND_ICP_NUMBER:-}
      - BRAND_CONTACT_URL=${BRAND_CONTACT_URL:-}
    volumes:
      - frontend-dist:/usr/share/nginx/html
    # entrypoint（40-generate-config.sh）每次启动都会 rm -rf 共享卷再重新 cp 构建产物、
    # 最后生成 config.js；nginx 服务只读挂载同一个卷对外提供服务。
    # 没有这个 healthcheck，nginx 的 depends_on 只能等到本容器"进程已启动"，
    # 等不到 rm+cp 跑完，会有窗口期共享卷是空的，用户请求拿到 403——
    # 且不止首次冷启动，每次 up -d / restart 都会重新触发这个窗口。
    # 用 config.js 判定：它是 entrypoint 里最后写的文件，存在即代表整个流程跑完；
    # 同时查 index.html 是防"卷里残留上次的 config.js，但这次 cp 还没跑完"的误判。
    # 检查本身只是两个 test -f，很轻，interval 可以比 mysql/redis 短。
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && test -f /usr/share/nginx/html/config.js"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - api-net

  admin:
    build:
      context: ./admin
    image: ai-platform-admin:latest
    restart: always
    environment:
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - SITE_NAME=${SITE_NAME:-AI API Platform}
      - BRAND_LOGO_URL=${BRAND_LOGO_URL:-}
      - BRAND_PRIMARY_COLOR=${BRAND_PRIMARY_COLOR:-#2ECC71}
      - BRAND_FOOTER_TEXT=${BRAND_FOOTER_TEXT:-}
      - BRAND_ICP_NUMBER=${BRAND_ICP_NUMBER:-}
      - BRAND_CONTACT_URL=${BRAND_CONTACT_URL:-}
    volumes:
      - admin-dist:/usr/share/nginx/html
    # 原因同 frontend 服务：entrypoint 每次启动都 rm -rf 共享卷再重新 cp，
    # config.js 是最后写入的文件，存在即代表本次同步已完成。
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && test -f /usr/share/nginx/html/config.js"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - api-net

  nginx:
    build:
      context: ./nginx
    image: ai-platform-nginx:latest
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-30M}
      - NGINX_PROXY_READ_TIMEOUT=${NGINX_PROXY_READ_TIMEOUT:-320}
      - SSL_MODE=${SSL_MODE:-none}
    volumes:
      - frontend-dist:/var/www/frontend:ro
      - admin-dist:/var/www/admin:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      # backend 没有 healthcheck，保持 service_started（等价于原来的列表形式，不改语义）。
      backend:
        condition: service_started
      # frontend/admin 必须等 healthcheck 变 healthy（即共享卷里 config.js 已生成）
      # 才能启动 nginx，否则会读到 rm -rf 之后、cp 完成之前的空目录，返回 403。
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - api-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    profiles: ["letsencrypt"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # 每 12 小时检查一次续期。首次签发需手动执行 docker compose run 命令，
    # 见 docs/deployment.md
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - api-net

networks:
  api-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  backend-data:
  frontend-dist:
  admin-dist:
  certbot-www:
  certbot-conf:
