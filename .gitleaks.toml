# gitleaks 配置。基线：2026-07-23 全历史扫描（243 commits）确认无真实密钥泄漏。
# 以下 allowlist 全部是人工逐条核实过的误报，不是"扫不干净就加白名单"。
[extend]
useDefault = true

[[allowlists]]
description = "实施计划文档中的 Go 单测固定常量（2026-07-23 人工核实，非真实凭据）"
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "实施计划验收步骤中的一次性测试密码（2026-07-23 人工核实，非真实凭据）"
regexes = ['''acceptpw123456''']

[[allowlists]]
description = "验收记录文档中一次性测试用户的登录密码（2026-07-24 人工核实，测试实例已销毁，非真实凭据）"
regexes = ['''AcceptPW123456''']

[[allowlists]]
description = "API 文档中给用户看的令牌占位符 sk-你的令牌"
regexes = ['''sk-(你的令牌|xxx|your-token)''']
